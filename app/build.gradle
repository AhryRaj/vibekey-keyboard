apply plugin: 'com.android.application'

def envFile = rootProject.file('.env')
def envProps = new Properties()
if (envFile.exists()) {
    envFile.withReader('UTF-8') { reader ->
        envProps.load(reader)
    }
}
def klipyApiKey = envProps.getProperty('KLIPY_API_KEY', '')

android {
    namespace "com.cinepulse.keyboard"
    compileSdk 36

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId "com.cinepulse.keyboard"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0.0"

        buildConfigField "String", "KLIPY_API_KEY", "\"${klipyApiKey}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.15.0'

    constraints {
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22") {
            because("kotlin-stdlib-jdk7 is now part of kotlin-stdlib")
        }
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22") {
            because("kotlin-stdlib-jdk8 is now part of kotlin-stdlib")
        }
    }
}
